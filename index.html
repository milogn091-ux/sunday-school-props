<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="主日學教具">
<meta name="theme-color" content="#f5f5f7">
<link rel="apple-touch-icon" href="phone-icon.png">
<link rel="manifest" href="manifest.json">
<title>主日學教具</title>
<style>
:root { --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --text2:#6e6e73; --text3:#aeaeb2; --line:rgba(60,60,67,.12); --accent:#007aff; --red:#ff3b30; --green:#34c759;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang TC","Noto Sans TC",sans-serif; --st:#007aff; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font); -webkit-text-size-adjust:100%; }
body { -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; touch-action:manipulation; }
.hidden { display:none !important; }
.view { min-height:100%; padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 28px); }

/* 首頁 */
.nav { display:flex; align-items:center; justify-content:space-between; min-height:44px; }
.nav h1 { font-size:30px; font-weight:800; margin:6px 0 2px; letter-spacing:.2px; }
.nav-btn { height:36px; min-width:36px; padding:0 12px; border-radius:18px; background:rgba(118,118,128,.12); color:var(--accent); font-weight:600; font-size:15px; display:inline-flex; align-items:center; gap:6px; }
.sub { color:var(--text2); font-size:15px; margin:0 0 16px; line-height:1.45; }
.group-title { font-size:13px; color:var(--text2); margin:22px 4px 8px; text-transform:uppercase; letter-spacing:.4px; }
.list { background:var(--card); border-radius:14px; overflow:hidden; }
.row { display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%; text-align:left; position:relative; }
.row + .row::before { content:''; position:absolute; left:58px; right:0; top:0; height:.5px; background:var(--line); }
.row:active { background:#e5e5ea; }
.num { width:34px; height:34px; border-radius:50%; color:#fff; font-weight:800; font-size:16px; display:grid; place-items:center; flex:none; }
.row-main { flex:1; min-width:0; }
.row-main b { display:block; font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-main small { display:block; font-size:13px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chev { color:var(--text3); font-size:20px; }
.callout { background:var(--card); border-radius:14px; padding:14px 16px; font-size:17px; line-height:1.5; }
.callout small { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; }
.empty { text-align:center; color:var(--text2); padding:60px 20px; line-height:1.7; font-size:16px; }
.updated { text-align:center; font-size:12px; color:var(--text3); margin-top:18px; }

/* 單站 */
.st-top { display:flex; align-items:center; justify-content:space-between; min-height:44px; }
.back { color:var(--accent); font-size:17px; display:inline-flex; align-items:center; gap:2px; height:44px; padding-right:10px; }
.pager { display:flex; gap:8px; align-items:center; font-size:15px; color:var(--text2); }
.pager button { width:36px; height:36px; border-radius:18px; background:rgba(118,118,128,.12); color:var(--accent); font-size:18px; font-weight:600; }
.pager button:disabled { opacity:.3; }
.hero { border-radius:20px; padding:18px 18px 20px; color:#fff; background:var(--st); margin-top:6px; box-shadow:0 8px 24px color-mix(in srgb, var(--st) 35%, transparent); }
.hero-n { font-size:13px; font-weight:700; opacity:.85; letter-spacing:.5px; }
.hero h2 { font-size:28px; margin:2px 0 10px; font-weight:800; }
.hero .motto { font-size:20px; font-weight:700; line-height:1.4; background:rgba(255,255,255,.18); border-radius:12px; padding:10px 12px; }
.hero .helper { font-size:14px; opacity:.9; margin-top:10px; }
.suggest { display:flex; align-items:center; gap:12px; width:100%; margin-top:14px; padding:14px 16px; border-radius:16px; background:var(--card); text-align:left; border:2px solid var(--st); }
.suggest:active { transform:scale(.98); }
.suggest .ic { font-size:30px; }
.suggest b { display:block; font-size:17px; }
.suggest small { display:block; font-size:13px; color:var(--text2); margin-top:2px; line-height:1.4; }
.tools { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.tool { background:var(--card); border-radius:16px; padding:14px 12px; text-align:left; min-height:84px; display:flex; flex-direction:column; justify-content:space-between; }
.tool:active { transform:scale(.97); background:#e5e5ea; }
.tool .ic { font-size:26px; }
.tool b { font-size:16px; font-weight:600; }
.tool small { font-size:12px; color:var(--text2); }
.sfx { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.sfx button { background:var(--card); border-radius:14px; padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; font-weight:600; }
.sfx button:active { transform:scale(.95); background:#e5e5ea; }
.sfx .ic { font-size:24px; }
details.lead { background:var(--card); border-radius:14px; margin-top:10px; }
details.lead summary { padding:14px 16px; font-size:16px; font-weight:600; list-style:none; display:flex; justify-content:space-between; }
details.lead summary::-webkit-details-marker { display:none; }
details.lead[open] summary .chev { transform:rotate(90deg); }
.lead-body { padding:0 16px 14px; font-size:15px; line-height:1.6; }
.lead-body h4 { font-size:12px; color:var(--text2); margin:10px 0 2px; font-weight:600; }
.lead-body ol { margin:0; padding-left:20px; }

/* 全螢幕工具 */
.full { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; background:#000; color:#fff; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.full-bar { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; position:relative; z-index:2; }
.x { width:40px; height:40px; border-radius:20px; background:rgba(255,255,255,.2); font-size:22px; color:#fff; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.full-title { font-size:15px; font-weight:600; opacity:.85; }
.pill { height:36px; padding:0 14px; border-radius:18px; background:rgba(255,255,255,.2); color:#fff; font-weight:600; font-size:14px; }
.pill.on { background:#fff; color:#000; }
.full-main { flex:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.poster-text { font-weight:900; text-align:center; line-height:1.15; padding:0 4vw; word-break:keep-all; overflow-wrap:anywhere; text-shadow:0 2px 12px rgba(0,0,0,.15); }
.dots { display:flex; gap:7px; justify-content:center; padding:10px 0 14px; }
.dots i { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); }
.dots i.on { background:#fff; }
.hint { position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:12px; opacity:.6; }
.big-num { font-size:min(42vw, 52vh); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; line-height:1; }
.ctrl { display:flex; gap:12px; justify-content:center; padding:14px 16px 18px; flex-wrap:wrap; }
.ctrl button { height:56px; min-width:72px; padding:0 18px; border-radius:28px; background:rgba(255,255,255,.18); color:#fff; font-size:17px; font-weight:700; }
.ctrl button.primary { background:#fff; color:#000; min-width:130px; }
.ring { position:absolute; inset:0; margin:auto; width:min(86vw,70vh); height:min(86vw,70vh); }
.score { flex:1; display:grid; grid-template-columns:1fr 1fr; }
.team { display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
.team .tn { font-size:22px; font-weight:800; opacity:.9; }
.team .ts { font-size:min(30vw,40vh); font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
.team .minus { position:absolute; bottom:16px; width:52px; height:52px; border-radius:26px; background:rgba(0,0,0,.2); color:#fff; font-size:28px; font-weight:700; }
.team:active { filter:brightness(1.08); }
.color-name { font-size:min(34vw,40vh); font-weight:900; text-shadow:0 4px 20px rgba(0,0,0,.18); }
.music-art { width:min(60vw,40vh); height:min(60vw,40vh); border-radius:28px; background:linear-gradient(145deg, rgba(255,255,255,.25), rgba(255,255,255,.05)); display:grid; place-items:center; font-size:min(24vw,16vh); }
.music-art.playing { animation:beat .6s ease-in-out infinite alternate; }
@keyframes beat { to { transform:scale(1.05); } }
.music-name { text-align:center; font-size:17px; font-weight:600; margin-top:18px; padding:0 20px; }
.music-sub { text-align:center; font-size:13px; opacity:.7; margin-top:4px; }
.music-art.small { width:min(44vw,24vh); height:min(44vw,24vh); font-size:min(18vw,10vh); }
.chips { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:4px 16px 0; }
.chip { min-height:46px; padding:6px 6px; border-radius:14px; background:rgba(255,255,255,.2); color:#fff; font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; gap:5px; line-height:1.2; }
.chip span { font-size:18px; }
.chip.on { background:#fff; color:#000; }
.tb-setup { flex:1; overflow-y:auto; padding:4px 16px 8px; }
.tb-h { font-size:13px; font-weight:700; opacity:.85; margin:14px 4px 8px; }
.tb-row { display:block; width:100%; text-align:left; background:rgba(255,255,255,.18); border-radius:14px; padding:12px 14px; margin-bottom:8px; color:#fff; border:2px solid transparent; }
.tb-row b { display:block; font-size:17px; }
.tb-row small { display:block; font-size:13px; opacity:.85; margin-top:2px; }
.tb-row.on { background:#fff; color:#000; }
.tb-note { font-size:13px; opacity:.85; line-height:1.6; margin:12px 4px 0; }
.tb-phase { font-size:min(12vw,7vh); font-weight:900; position:relative; z-index:1; margin-bottom:1vh; }
.tb-next { font-size:16px; font-weight:600; opacity:.85; margin-top:1.5vh; position:relative; z-index:1; }
.flash { animation:flash .5s 3; }
@keyframes flash { 50% { background:#ff3b30; } }
.toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:rgba(0,0,0,.82); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:100; max-width:86vw; text-align:center; }
</style>
</head>
<body>
<div id="home" class="view"></div>
<div id="station" class="view hidden"></div>
<div id="full" class="full hidden"></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="musicFile" accept="audio/*" class="hidden">
<audio id="audio" playsinline></audio>

<script>window.OFFLINE_SITE = true;</script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AID = {
  countdown: { ic: '⏱️', name: '倒數計時' }, counter: { ic: '🏆', name: '計分板' }, colorCall: { ic: '🎨', name: '顏色指令' },
  wordCards: { ic: '🔤', name: '字卡' }, randomPick: { ic: '🎲', name: '抽號碼' }, music: { ic: '🎵', name: '背景音樂' }, tabata: { ic: '🔥', name: 'Tabata 間歇' }
};
let lesson = null, cur = 0;

// ───── 三種開法：家裡 Wi-Fi（lan）、帶出門的離線網站（site）、匯出的單一檔案（file） ─────
const MODE = window.EMBEDDED_LESSON ? 'file' : window.OFFLINE_SITE ? 'site' : 'lan';
let offlineUrl = '';
function toCode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromCode(code) {
  const bin = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function takeCode(text) {
  const m = String(text || '').match(/#L=([A-Za-z0-9_-]+)/); if (!m) return false;
  const j = fromCode(m[1]); if (!j?.stations?.length) return false;
  lesson = j; localStorage.setItem('lesson', JSON.stringify(j)); return true;
}
// 家裡：把教案帶去離線網站（同時複製連結，給「加入主畫面」的圖示用）
function carryOut() {
  if (!lesson || !offlineUrl) return;
  const link = offlineUrl + '#L=' + toCode(lesson);
  try { const t = document.createElement('textarea'); t.value = link; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); t.setSelectionRange(0, link.length); document.execCommand('copy'); t.remove(); } catch {}
  location.href = link;
}
// 離線網站：從剪貼簿貼上新教案
async function pasteLesson() {
  try {
    const txt = await navigator.clipboard.readText();
    if (takeCode(txt)) { renderHome(); toast('已換成新的教案'); return; }
  } catch {}
  toast('剪貼簿裡沒有教案。請在家連 Wi-Fi，打開教具按「帶出門」');
}

// ───── 讀取教案（電腦關掉時用上次存的） ─────
async function load(showToast) {
  if (MODE === 'file') { lesson = window.EMBEDDED_LESSON; renderHome(); if (showToast) toast('這是匯出的離線版，要更新請在電腦重新匯出'); return; }
  if (MODE === 'site') {
    if (showToast) return pasteLesson();
    try { if (takeCode(location.hash)) { history.replaceState(null, '', location.pathname); setTimeout(() => toast('已存好本週教案，在外面沒網路也能用'), 300); } } catch {}
    if (!lesson) { try { lesson = JSON.parse(localStorage.getItem('lesson')); } catch {} }
    renderHome(); return;
  }
  fetch('/api/offline-url').then((r) => r.json()).then((j) => { if (j.url && !offlineUrl) { offlineUrl = j.url; renderHome(); } }).catch(() => {});
  try {
    const r = await fetch('/api/lesson', { cache: 'no-store' });
    const j = await r.json();
    if (!j.empty) { lesson = j; localStorage.setItem('lesson', JSON.stringify(j)); if (showToast) toast('已更新教案'); }
  } catch {
    if (showToast) toast('連不到電腦，先用上次的教案');
  }
  if (!lesson) { try { lesson = JSON.parse(localStorage.getItem('lesson')); } catch {} }
  renderHome();
  if (!$('#station').classList.contains('hidden')) renderStation();
}

function renderHome() {
  const h = $('#home');
  if (!lesson || !lesson.stations?.length) {
    h.innerHTML = MODE === 'site'
      ? `<div class="nav"><h1>主日學教具</h1><button class="nav-btn" onclick="load(true)">📋 貼上教案</button></div>
      <div class="empty">還沒有教案。<br>請在家連上 Wi-Fi，打開家裡的教具，<br>按右上角「🎒 帶出門」。</div>`
      : `<div class="nav"><h1>主日學教具</h1><button class="nav-btn" onclick="load(true)">↻</button></div>
      <div class="empty">還沒有教案。<br>請先在電腦上按「設計本週活動」，<br>再按這裡右上角的 ↻ 更新。</div>`;
    return;
  }
  const L = lesson;
  h.innerHTML = `
    <div class="nav">${MODE === 'lan' && offlineUrl ? '<button class="nav-btn" onclick="carryOut()">🎒 帶出門</button>' : '<span></span>'}<button class="nav-btn" onclick="load(true)">${MODE === 'site' ? '📋 貼上新教案' : '↻ 更新'}</button></div>
    ${MODE === 'site' ? `<p class="sub" style="margin-top:0">離線版・存好的教案${L.updatedAt ? '（' + new Date(L.updatedAt).toLocaleDateString('zh-TW') + '）' : ''}</p>` : ''}
    <div class="nav"><h1>${esc(L.title || '本週活動')}</h1></div>
    ${L.bigIdea ? `<p class="sub">${esc(L.bigIdea)}</p>` : ''}
    <div class="group-title">關卡</div>
    <div class="list">${L.stations.map((s, i) => `
      <button class="row" onclick="openStation(${i})">
        <span class="num" style="background:${s.color}">${s.number}</span>
        <span class="row-main"><b>${esc(s.name)}</b><small>${s.aid ? AID[s.aid].ic + ' ' + AID[s.aid].name + '・' : ''}${esc(s.motto || s.propName || '')}</small></span>
        <span class="chev">›</span>
      </button>`).join('')}
    </div>
    <div class="group-title">共用工具</div>
    <div class="tools">
      ${tool('🎲', '抽號碼', `1～${L.kids || 10} 號`, "openTool('randomPick')")}
      ${tool('🏆', '計分板', '兩隊加分', "openTool('counter')")}
      ${tool('⏱️', '倒數計時', '60 秒', "openTool('countdown',{seconds:60})")}
      ${tool('🎵', '背景音樂', '9 首內建音樂', "openTool('music')")}
      ${tool('🔥', 'Tabata', '動 20 休 10・有音樂', "openTool('tabata')")}
      ${tool('🎨', '顏色指令', '看顏色做動作', "openTool('colorCall')")}
    </div>
    ${L.takeHome ? `<div class="group-title">帶回家的一句話</div><div class="callout">${esc(L.takeHome)}</div>` : ''}
    ${L.review?.length ? `<div class="group-title">複習問答</div><div class="list">${L.review.map((r, i) => `<div class="row" style="display:block"><b style="font-size:16px">Q${i + 1}. ${esc(r.q)}</b><div style="color:var(--text2);font-size:15px;margin-top:4px">${esc(r.a)}</div></div>`).join('')}</div>` : ''}
    ${L.prayer ? `<div class="group-title">結束禱告</div><div class="callout" style="font-size:16px">${esc(L.prayer)}</div>` : ''}
    <div class="updated">${L.updatedAt ? '教案更新於 ' + new Date(L.updatedAt).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}</div>`;
}
function tool(ic, name, sub, onclick) { return `<button class="tool" onclick="${onclick}"><span class="ic">${ic}</span><span><b>${name}</b><br><small>${sub}</small></span></button>`; }

function openStation(i) { cur = i; $('#home').classList.add('hidden'); $('#station').classList.remove('hidden'); renderStation(); window.scrollTo(0, 0); unlockAudio(); keepAwake(); }
function goHome() { $('#station').classList.add('hidden'); $('#home').classList.remove('hidden'); }
function st() { return lesson.stations[cur]; }

function renderStation() {
  const s = st(); if (!s) return goHome();
  document.documentElement.style.setProperty('--st', s.color || '#007aff');
  const n = lesson.stations.length;
  const sec = s.seconds || 60;
  const sg = s.aid ? AID[s.aid] : null;
  $('#station').innerHTML = `
    <div class="st-top">
      <button class="back" onclick="goHome()">‹ 全部關卡</button>
      <div class="pager"><button onclick="openStation(${cur - 1})" ${cur === 0 ? 'disabled' : ''}>‹</button>${cur + 1} / ${n}<button onclick="openStation(${cur + 1})" ${cur === n - 1 ? 'disabled' : ''}>›</button></div>
    </div>
    <div class="hero">
      <div class="hero-n">第 ${s.number} 站・${esc(s.propName || '')}</div>
      <h2>${esc(s.name)}</h2>
      ${s.motto ? `<div class="motto">「${esc(s.motto)}」</div>` : ''}
      ${s.helperLine ? `<div class="helper">助教：${esc(s.helperLine)}</div>` : ''}
    </div>
    ${sg ? `<button class="suggest" onclick="openTool('${s.aid}')"><span class="ic">${sg.ic}</span><span><b>這站建議：${sg.name}</b><small>${esc(s.aidNote || '')}</small></span></button>` : ''}
    <div class="tools">
      ${tool('🪧', '大字報', '橫拿給孩子看', "openTool('poster')")}
      ${tool('🗣️', '唸口訣', '手機大聲唸', 'speakMotto()')}
      ${tool('⏱️', '倒數計時', sec + ' 秒', "openTool('countdown')")}
      ${tool('🏆', '計分板', '兩隊加分', "openTool('counter')")}
      ${tool('🎨', '顏色指令', '看顏色做動作', "openTool('colorCall')")}
      ${tool('🔤', '字卡', '口訣一詞一張', "openTool('wordCards')")}
      ${tool('🎲', '抽號碼', '決定誰先', "openTool('randomPick')")}
      ${tool('🎵', '背景音樂', '音樂停就停', "openTool('music')")}
      ${tool('🔥', 'Tabata', '間歇運動＋音樂', "openTool('tabata')")}
      ${tool('📣', '倒數 3 2 1', '嗶嗶嗶—開始', 'SFX.countIn()')}
    </div>
    <div class="group-title">音效</div>
    <div class="sfx">

// ───── 全螢幕工具 ─────
const full = $('#full');
let cleanup = null;
function closeFull() { if (cleanup) cleanup(); cleanup = null; full.classList.add('hidden'); full.innerHTML = ''; full.style.background = ''; full.className = 'full hidden'; }
function openTool(kind, opt = {}) {
  unlockAudio(); keepAwake();
  if (cleanup) cleanup(); cleanup = null;
  full.classList.remove('hidden');
  ({ poster, countdown, counter, colorCall, wordCards, randomPick, music, tabata })[kind](opt);
}
function bar(title, right = '') { return `<div class="full-bar"><button class="x" onclick="closeFull()">✕</button><span class="full-title">${esc(title)}</span><span>${right || '<span style="width:40px;display:inline-block"></span>'}</span></div>`; }
function sName() { return lesson && $('#station').classList.contains('hidden') ? '' : st()?.name || ''; }

// 大字報：點右邊下一張、左邊上一張；字自動放到最大
function poster() {
  const s = st();
  const lines = [...(s.poster?.length ? s.poster : []), s.motto].filter((x, i, a) => x && a.indexOf(x) === i);
  if (!lines.length) lines.push(s.name);
  let i = 0;
  full.style.background = s.color;
  const draw = () => {
    full.innerHTML = bar(`${s.name}・大字報`, `<button class="pill" onclick="speak(document.querySelector('.poster-text').textContent)">🗣️</button>`) +
      `<div class="full-main" id="pm"><div class="poster-text" id="pt">${esc(lines[i])}</div><div class="hint">點右邊下一張・左邊上一張・手機橫拿字更大</div></div>
       <div class="dots">${lines.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>`;
    fit($('#pt'), $('#pm'));
    $('#pm').onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); i = (i + (e.clientX > r.left + r.width / 2 ? 1 : lines.length - 1)) % lines.length; draw(); };
  };
  draw();
  const onR = () => fit($('#pt'), $('#pm'));
  window.addEventListener('resize', onR);
  cleanup = () => window.removeEventListener('resize', onR);
}
function fit(el, box) {
  if (!el || !box) return;
  const W = box.clientWidth * 0.92, H = box.clientHeight * 0.82;
  let lo = 20, hi = 600;
  while (hi - lo > 2) { const m = (lo + hi) / 2; el.style.fontSize = m + 'px'; (el.scrollWidth <= W && el.scrollHeight <= H) ? (lo = m) : (hi = m); }
  el.style.fontSize = lo + 'px';
}

// 倒數計時
function countdown(opt) {
  const total = opt.seconds || st()?.seconds || 60;
  let left = total, timer = 0, running = false;
  full.style.background = '#000';
  full.innerHTML = bar(sName() ? `${sName()}・倒數` : '倒數計時') + `
    <div class="full-main"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="4"/>
      <circle id="rg" cx="50" cy="50" r="46" fill="none" stroke="#34c759" stroke-width="4" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg>
      <div class="big-num" id="cn"></div></div>
    <div class="ctrl"><button onclick="cdAdd(-10)">−10</button><button class="primary" id="cb" onclick="cdToggle()">開始</button><button onclick="cdAdd(10)">+10</button><button onclick="cdReset()">重來</button></div>`;
  const draw = () => {
    const m = Math.floor(left / 60), s = left % 60;
    $('#cn').textContent = total >= 60 ? `${m}:${String(s).padStart(2, '0')}` : left;
    $('#rg').style.strokeDashoffset = 289 * (1 - left / total);
    $('#rg').style.stroke = left <= 5 ? '#ff3b30' : left <= total * 0.3 ? '#ff9f0a' : '#34c759';
    $('#cb').textContent = running ? '暫停' : left === total ? '開始' : left === 0 ? '重來' : '繼續';
  };
  const tick = () => {
    left--; if (left <= 5 && left > 0) SFX.tick();
    if (left <= 0) { left = 0; stop(); SFX.buzzer(); full.classList.add('flash'); setTimeout(() => full.classList.remove('flash'), 1600); }
    draw();
  };
  const stop = () => { running = false; clearInterval(timer); };
  window.cdToggle = () => { if (left === 0) { left = total; draw(); return; } if (running) stop(); else { if (left === total) SFX.whistle(); running = true; timer = setInterval(tick, 1000); } draw(); };
  window.cdAdd = (d) => { left = Math.max(1, left + d); draw(); };
  window.cdReset = () => { stop(); left = total; draw(); };
  draw();
  cleanup = stop;
}

// 計分板
function counter() {
  const key = 'score';
  let sc = { a: 0, b: 0 };
  try { sc = JSON.parse(sessionStorage.getItem(key)) || sc; } catch {}
  full.style.background = '#000';
  const draw = () => {
    full.innerHTML = bar('計分板', `<button class="pill" onclick="scReset()">歸零</button>`) + `
      <div class="score">
        <div class="team" style="background:#ff3b30" onclick="scAdd('a',1,event)"><div class="tn">紅隊</div><div class="ts">${sc.a}</div><button class="minus" onclick="scAdd('a',-1,event)">−</button></div>
        <div class="team" style="background:#007aff" onclick="scAdd('b',1,event)"><div class="tn">藍隊</div><div class="ts">${sc.b}</div><button class="minus" onclick="scAdd('b',-1,event)">−</button></div>
      </div>`;
    sessionStorage.setItem(key, JSON.stringify(sc));

}

const COLORS = [['紅', '#ff3b30'], ['黃', '#ffcc00'], ['藍', '#007aff'], ['綠', '#34c759']];
function colorCall() {
  let last = -1, auto = 0, interval = 4;

    let k; do { k = Math.floor(Math.random() * COLORS.length); } while (k === last); last = k;
    full.style.background = COLORS[k][1];

    `<div class="full-main" onclick="caNext()"><div class="color-name" id="cname">點一下</div><div class="hint">點畫面換顏色・按「自動」每 ${interval} 秒換一次</div></div>`;
  full.style.background = '#1c1c1e';

function wordCards() {

// 抽號碼
function randomPick() {
  let max = lesson?.kids || 10, used = [];
  full.style.background = 'linear-gradient(160deg,#5e5ce6,#bf5af2)';
  const draw = (n = '?') => {
    full.innerHTML = bar('抽號碼', `<button class="pill" onclick="rpSet()">1～${max}</button>`) +

       <div class="ctrl"><button class="primary" onclick="rpGo()">抽！</button></div>`;
  };
  window.rpSet = () => { const v = parseInt(prompt('最大號碼（例如班上人數）', max)); if (v > 0) { max = v; used = []; draw(); } };
  window.rpGo = () => {
    if (used.length >= max) used = [];
    const pool = Array.from({ length: max }, (_, k) => k + 1).filter((k) => !used.includes(k));
    const pick = pool[Math.floor(Math.random() * pool.length)];
    used.push(pick);
    SFX.drum();
    let t = 0;
    const roll = setInterval(() => { $('#rn').textContent = Math.ceil(Math.random() * max); if (++t > 14) { clearInterval(roll); $('#rn').textContent = pick; SFX.ding(); } }, 70);
  };
  draw();
}

// 背景音樂：內建 9 首原創合成音樂（不用網路），也可以選手機裡的歌；可設「隨機停」玩大風吹
function music() {
  const key = sName() ? 'music-' + st().number : 'music-common';
  const audio = $('#audio');
  let sel = localStorage.getItem('musicTrack') || 'dance';
  let stopTimer = 0, stopMode = false, player = null, rec = null;
  const playing = () => !!player || !audio.paused;
  const draw = () => {
    if (sel === 'mine' && !rec) sel = 'dance';
    const t = sel === 'mine' ? { name: rec.name, ic: '📱', sub: '手機裡的歌', bg: 'linear-gradient(160deg,#ff375f,#ff9f0a)', bpm: 100 } : TRACKS[sel];
    full.style.background = t.bg;
    const chips = Object.entries(TRACKS).filter(([, x]) => !x.hidden).map(([id, x]) => `<button class="chip ${sel === id ? 'on' : ''}" onclick="muSel('${id}')"><span>${x.ic}</span>${x.name}</button>`).join('')
      + (rec ? `<button class="chip ${sel === 'mine' ? 'on' : ''}" onclick="muSel('mine')"><span>📱</span>${esc(rec.name.slice(0, 6))}</button>` : '');
    full.innerHTML = bar(sName() ? `${sName()}・音樂` : '背景音樂', `<button class="pill ${stopMode ? 'on' : ''}" onclick="muStop()">隨機停</button>`) + `
      <div class="full-main" style="flex-direction:column"><div class="music-art small ${playing() ? 'playing' : ''}" style="animation-duration:${(60 / t.bpm).toFixed(2)}s">${t.ic}</div>
        <div class="music-name">${esc(t.name)}</div>
        <div class="music-sub">${stopMode ? '音樂會在 5～15 秒之間突然停，孩子要馬上停住！' : esc(t.sub)}</div></div>
      <div class="chips">${chips}</div>
      <div class="ctrl"><button onclick="muPick()">${rec ? '換手機裡的歌' : '📱 選手機裡的歌'}</button><button class="primary" onclick="muPlay()">${playing() ? '暫停' : '播放'}</button></div>`;
  };
  const stopAll = () => { audio.pause(); if (player) { player.stop(); player = null; } clearTimeout(stopTimer); };
  const armStop = () => { clearTimeout(stopTimer); if (stopMode && playing()) stopTimer = setTimeout(() => { stopAll(); SFX.whistle(); draw(); toast('停！'); }, 5000 + Math.random() * 10000); };
  const start = () => {
    if (sel === 'mine') {
      if (audio.dataset.key !== rec.name) { if (audio.src) URL.revokeObjectURL(audio.src); audio.src = URL.createObjectURL(rec.blob); audio.dataset.key = rec.name; }
      audio.play().catch(() => toast('無法播放這個檔案'));
    } else player = startTrack(sel);
  };
  window.muPlay = () => { if (playing()) { stopAll(); draw(); return; } start(); armStop(); draw(); };
  window.muSel = (id) => { const was = playing(); stopAll(); sel = id; try { localStorage.setItem('musicTrack', id); } catch {} start(); armStop(); draw(); };
  window.muStop = () => { stopMode = !stopMode; armStop(); draw(); };
  window.muPick = () => { const f = $('#musicFile'); f.onchange = async () => { const file = f.files[0]; f.value = ''; if (!file) return; stopAll(); rec = { name: file.name.replace(/\.[^.]+$/, ''), blob: file }; await idbSet(key, rec); if (key !== 'music-common' && !(await idbGet('music-common'))) await idbSet('music-common', rec); sel = 'mine'; toast('已存在這支手機，下次直接播放'); draw(); }; f.click(); };
  audio.onended = () => draw();
  draw();
  (async () => { rec = await idbGet(key) || await idbGet('music-common'); draw(); })();
  cleanup = stopAll;
}

// Tabata 間歇運動：動 → 休 → 動…，運動時播高能音樂，休息自動換輕柔音樂，最後 3 秒嗶嗶
const TABATA_PRESETS = [
  { name: '標準 Tabata', work: 20, rest: 10, rounds: 8 },
  { name: '兒童輕鬆版', work: 15, rest: 15, rounds: 6 },
  { name: '挑戰版', work: 30, rest: 15, rounds: 6 },
  { name: '暖身版', work: 40, rest: 20, rounds: 4 }
];
function tabata() {
  let cfg = { p: 0, track: 'tabata', custom: null };
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem('tabata'))); } catch {}
  let iv = 0, player = null;
  const plan = () => (cfg.p === -1 && cfg.custom) || TABATA_PRESETS[cfg.p] || TABATA_PRESETS[0];
  const fmt = (s) => s >= 60 ? `${Math.floor(s / 60)} 分${s % 60 ? ' ' + (s % 60) + ' 秒' : '鐘'}` : s + ' 秒';
  const switchTrack = (id) => { if (player && player.id === id) return; if (player) player.stop(); player = id ? startTrack(id) : null; };
  const stopAll = () => { clearInterval(iv); iv = 0; switchTrack(null); };
  const save = () => { try { localStorage.setItem('tabata', JSON.stringify(cfg)); } catch {} };

  const setup = () => {
    stopAll();
    full.style.background = 'linear-gradient(160deg,#ff453a,#ff9f0a)';
    const opt = (p, i) => { const tot = p.work * p.rounds + p.rest * (p.rounds - 1); return `<button class="tb-row ${cfg.p === i ? 'on' : ''}" onclick="tbPick(${i})"><b>${esc(p.name)}</b><small>動 ${p.work} 秒・休 ${p.rest} 秒・${p.rounds} 回（約 ${fmt(tot)}）</small></button>`; };
    const energy = ['tabata', 'sprint', 'dance', 'march', 'kids', 'groove'];
    full.innerHTML = bar('Tabata 間歇運動') + `
      <div class="tb-setup">
        <div class="tb-h">選時間</div>
        ${TABATA_PRESETS.map(opt).join('')}
        ${opt(cfg.custom || { name: '自訂', work: 20, rest: 10, rounds: 8 }, -1).replace('onclick="tbPick(-1)"', 'onclick="tbCustom()"')}
        <div class="tb-h">運動時的音樂</div>
        <div class="chips" style="padding:0">${energy.map((id) => `<button class="chip ${cfg.track === id ? 'on' : ''}" onclick="tbTrack('${id}')"><span>${TRACKS[id].ic}</span>${TRACKS[id].name}</button>`).join('')}<button class="chip ${cfg.track === '' ? 'on' : ''}" onclick="tbTrack('')"><span>🔇</span>不要音樂</button></div>
        <div class="tb-note">開始前有 10 秒準備。休息時會換成輕柔音樂，每段最後 3 秒會嗶嗶提醒。手機音量記得開大。</div>
      </div>
      <div class="ctrl"><button class="primary" onclick="tbGo()">開始</button></div>`;
  };
  window.tbPick = (i) => { cfg.p = i; save(); setup(); };
  window.tbCustom = () => {
    const w = parseInt(prompt('每回運動幾秒？', cfg.custom?.work || 20)); if (!(w > 0)) return;
    const r = parseInt(prompt('每回休息幾秒？', cfg.custom?.rest ?? 10)); if (!(r >= 0)) return;
    const n = parseInt(prompt('總共幾回？', cfg.custom?.rounds || 8)); if (!(n > 0)) return;
    cfg.custom = { name: '自訂', work: w, rest: r, rounds: n }; cfg.p = -1; save(); setup();
  };
  window.tbTrack = (id) => { cfg.track = id; save(); if (player) switchTrack(null); if (id) { player = startTrack(id); setTimeout(() => { if (!iv) switchTrack(null); }, 2500); } setup(); };

  window.tbGo = () => {
    unlockAudio(); keepAwake();
    const P = plan();
    const phases = [{ k: 'prep', d: 10 }];
    for (let r = 1; r <= P.rounds; r++) { phases.push({ k: 'work', d: P.work, r }); if (r < P.rounds && P.rest > 0) phases.push({ k: 'rest', d: P.rest, r }); }
    const LOOK = { prep: ['準備', '#ff9f0a'], work: ['動起來！', '#ff3b30'], rest: ['休息', '#0a84ff'] };
    let idx = 0, end = 0, paused = 0, last = -1;
    const draw = () => {
      const ph = phases[idx], nx = phases[idx + 1];
      full.style.background = LOOK[ph.k][1];
      full.innerHTML = bar('Tabata', `<span class="pill" style="display:inline-flex;align-items:center">${ph.r ? `第 ${ph.r} / ${P.rounds} 回` : '準備'}</span>`) + `
        <div class="full-main" style="flex-direction:column">
          <div class="tb-phase">${LOOK[ph.k][0]}</div>
          <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/>
            <circle id="tr" cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg>
          <div class="big-num" id="tn">${ph.d}</div>
          <div class="tb-next">${nx ? `下一個：${LOOK[nx.k][0].replace('！', '')} ${nx.d} 秒` : '最後一段，加油！'}</div>
        </div>
        <div class="dots">${Array.from({ length: P.rounds }, (_, k) => `<i class="${ph.r && k < ph.r ? 'on' : ''}"></i>`).join('')}</div>
        <div class="ctrl"><button onclick="tbStopAsk()">結束</button><button class="primary" id="tp" onclick="tbPause()">${paused ? '繼續' : '暫停'}</button><button onclick="tbSkip()">跳過 ›</button></div>`;
    };
    const begin = (i) => {
      idx = i; last = -1; const ph = phases[i];
      end = performance.now() + ph.d * 1000;
      if (ph.k === 'work') { SFX.whistle(); switchTrack(cfg.track); }
      else if (ph.k === 'rest') { SFX.ding(); switchTrack(cfg.track ? 'rest' : null); speak('休息'); }
      else { switchTrack(cfg.track ? 'rest' : null); speak('準備'); }
      draw();
    };
    const finish = () => {
      stopAll(); SFX.fanfare();
      full.style.background = 'linear-gradient(160deg,#30d158,#0a84ff)';
      full.innerHTML = bar('Tabata') + `<div class="full-main" style="flex-direction:column"><div style="font-size:90px">🎉</div><div class="tb-phase">完成！</div><div class="tb-next">${P.rounds} 回全部做完，大家好棒！</div></div>
        <div class="ctrl"><button onclick="tbSetup()">換設定</button><button class="primary" onclick="tbGo()">再一次</button></div>`;
    };
    const tick = () => {
      if (paused) return;
      const now = performance.now(), ph = phases[idx];
      if (now >= end) { if (idx + 1 < phases.length) begin(idx + 1); else finish(); return; }
      const left = Math.ceil((end - now) / 1000);
      const ring = $('#tr'); if (ring) ring.style.strokeDashoffset = 289 * (1 - (end - now) / (ph.d * 1000));
      if (left !== last) { last = left; const n = $('#tn'); if (n) n.textContent = left; if (left <= 3) SFX.beep(left === 1 ? 1320 : 880); }
    };
    window.tbPause = () => {
      if (paused) { end = performance.now() + paused; paused = 0; const ph = phases[idx]; switchTrack(ph.k === 'work' ? cfg.track : cfg.track ? 'rest' : null); }
      else { paused = end - performance.now(); switchTrack(null); }
      const b = $('#tp'); if (b) b.textContent = paused ? '繼續' : '暫停';
    };
    window.tbSkip = () => { paused = 0; if (idx + 1 < phases.length) begin(idx + 1); else finish(); };
    window.tbStopAsk = () => { if (confirm('結束這次 Tabata？')) setup(); };
    clearInterval(iv); begin(0); iv = setInterval(tick, 100);
  };
  window.tbSetup = setup;
  setup();
  cleanup = stopAll;
}

// ───── 唸口訣（iPhone 內建語音） ─────
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 0.9; u.pitch = 1.05;
  const v = speechSynthesis.getVoices().find((x) => /zh[-_]TW/i.test(x.lang)) || speechSynthesis.getVoices().find((x) => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function speakMotto() { const s = st(); speak(s.motto || s.name); toast('🗣️ ' + (s.motto || s.name)); }

// ───── 音效與音樂（手機即時合成，不用下載、沒網路也能響） ─────
// iPhone 的靜音鍵會把網頁音效關掉：用「播放模式」或一段無聲音檔，讓教具在靜音鍵開著時也有聲音
